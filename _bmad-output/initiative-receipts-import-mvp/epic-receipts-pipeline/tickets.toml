title = "Job steps, attempts and resume"
description = "Makes each AD-3 state a persisted step (pass 1, pass 2 with its checks, write) on the classifier's classes: waits with no attempt for unavailable and blocked, the shared attempt limit restarting from pass 1, the unsupported-twice rule with an unknown-chain fixture yielding other, the consistency mismatch as invalid, oversize after getFile as failed, the write_pending wait state (entry 13 classifies the PostgreSQL errors that enter it), payload_version resume, counting step starts for entry 13 to treat, and the in-place queue upgrade carrying every column entry 19 needs. The owner approves the one-time live pass-1 recording of a Lidl sample and runs the dev-bot check."
verify = "Unit tests with fake ports drive every transition of the AD-3 state diagram, including a restart between steps resuming from the persisted state without calling Gemini again from write_pending; on the dev bot a receipt sent while Gemini is blocked is stored after a restart and the fix, without a resend."
