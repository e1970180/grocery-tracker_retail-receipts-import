[[entry]]
id = 12
type = "story"
title = "Full outcome matrix and effect order"
description = "Completes notify for every outcome-matrix row: duplicate (reaction and message), unsupported chain (sender message, admin message), inconsistency and no-valid-result (failure reaction, message, admin reason and file copy, none on oversize), in-progress once, and not-accepted for unsupported content or a declared or unconfirmed size over 20 MB; plus the AD-11 effect order, local file deletion and the startup sweep."
verify = "Unit tests with fake ports produce each matrix row's reaction, message and admin notification from the texts file, and a failed send leaves the job state unchanged."
covers = ["CAP-5", "CAP-6", "CAP-8", "CAP-9"]
after = [7]
hitl = false
risk = "medium"
references = ["architecture-receipts-import/architecture-receipts-import.md#ad-11--order-of-effects-per-job"]

[[entry]]
id = 13
type = "story"
title = "Operational alerts and per-job error boundary"
description = "Adds the closed set of alert kinds sent once on start and once on recovery, including chain_reference for a plug-in missing or inactive in the reference, and the loop's per-job error boundary: PostgreSQL connection-class errors classified into entry 6's write_pending wait with postgres_unreachable, three unrecorded step starts from entry 6's counter treated as internal, and internal:<state>; using notify from entry 12."
verify = "Unit tests show a PostgreSQL connection error alerting once, recovering once and keeping the job in write_pending, and an induced internal error alerting once while the loop moves on."
covers = ["CAP-9", "CAP-10"]
after = [12]
hitl = false
risk = "medium"
references = ["architecture-receipts-import/architecture-receipts-import.md#ad-13--operational-alerts-on-state-change-adopted", "architecture-receipts-import/architecture-receipts-import.md#ad-16--per-job-error-boundary"]

