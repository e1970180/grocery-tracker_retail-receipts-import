[[entry]]
id = 4
type = "story"
title = "Tracer: a Spar receipt end to end"
description = "Builds the thinnest real path through every layer: NormalizedReceipt with Decimal money and the Zagreb-to-UTC function, covering every discount and settlement kind in the addendum so plug-ins add no migration, and the ports; the SQLite queue with the offset committed with the jobs; the vendored Telegram client with the gate for photos, image documents and PDFs, download and success reaction; Gemini pass 1 using entry 3's reader before each call, and pass 2 on the valid path; the plug-in interface including pass-1 time normalization, the registry and the Spar plug-in; the receipt schema migration with dedup and source-reference constraints, the feed table and the writer-role grants; the one-transaction writer; and the single loop. The owner supplies Spar samples and approves the one-time live recording."
verify = "On the dev bot, the owner sends a Spar PDF, sees the success reaction, and the stored receipt with lines, regular and effective prices and settlement matches its hand-verified record; the Spar fixture tests pass offline."
covers = ["CAP-1", "CAP-2", "CAP-3", "CAP-4", "CAP-5", "CAP-7", "CAP-8"]
after = [2, 3]
hitl = true
risk = "high"
references = ["architecture-receipts-import/architecture-receipts-import.md#ad-14--one-loop-one-thread-adopted", "architecture-receipts-import/architecture-receipts-import.md#ad-15--telegram-transport-is-the-vendored-reference-pack", "architecture-receipts-import/architecture-receipts-import.md#ad-17--one-normalized-receipt-shape"]

