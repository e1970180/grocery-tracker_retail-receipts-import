[[entry]]
id = 19
type = "story"
title = "Job wait backoff, short poll and failed downloads"
description = "Feeds the job's persisted wait count into classify, so backoff doubles to its cap and resets on each transition or attempt; builds the pipeline ports from Settings in one factory with a test on distinct non-default values; shortens the long poll to the next due job (AD-14); and ends a permanent download failure (a Telegram 4xx from getFile or the download, or no file_path) by consuming an attempt per failure, retrying after job_retry_delay_s and failing at the limit with the new reason file_unavailable and its owner-approved texts."
verify = "Unit tests show the second Gemini wait twice the first and capped, the factory delays and pixel cap equal to their distinct settings, a 7 s long poll with the next job due in 7 s, and a download 4xx failing the job with file_unavailable after the attempt limit."
covers = ["CAP-1", "CAP-9"]
after = [6]
hitl = false
risk = "medium"
references = ["architecture-receipts-import/architecture-receipts-import.md#ad-7--one-classification-of-extraction-results-adopted", "architecture-receipts-import/architecture-receipts-import.md#ad-14--one-loop-one-thread-adopted"]
notes = ["Decision: risk medium; a lost download affects one receipt, the sender is asked to resend, and no schema changes (owner, 2026-10-23).", "Decision: sender text 'Не удалось скачать файл из Telegram. Пришлите чек ещё раз.'; admin text 'Файл не скачивается из Telegram после всех попыток; копия не приложена.' (owner, 2026-10-23)."]

