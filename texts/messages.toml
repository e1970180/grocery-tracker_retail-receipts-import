# User- and admin-facing texts, keyed by outcome and failure reason.
# Every key must be present; the service refuses to start otherwise.
# Reactions must be emoji Telegram allows (Bot API, ReactionTypeEmoji), written without U+FE0F.

[reactions]
stored = "👍"
duplicate = "🤝"
failed = "👎"
in_progress = "👀"
not_accepted = "🙈"

[sender_messages]
duplicate = "Данный чек уже внесен в систему"
unsupported_chain = "Чеки этой сети пока не поддерживаются."
items_settlement_mismatch = "Не удалось обработать чек: сумма позиций не сходится с суммой оплат. Администратор получил копию."
total_settlement_mismatch = "Не удалось обработать чек: итог не сходится с оплатой картой и наличными. Администратор получил копию."
no_valid_result = "Не удалось распознать чек, в том числе магазин или дату покупки. Администратор получил копию."
file_too_large = "Файл больше 20 МБ, его нельзя обработать. Пришлите фото или файл поменьше."
file_unavailable = "Не удалось скачать файл из Telegram. Пришлите чек ещё раз."
internal_error = "Не удалось обработать чек из-за внутренней ошибки. Администратор уведомлён."

[admin_messages]
unsupported_chain = "Чек неподдерживаемой сети."
items_settlement_mismatch = "Сумма позиций не сходится с суммой оплат больше чем на 0,01 EUR."
total_settlement_mismatch = "Итог чека не сходится с суммой оплат картой и наличными больше чем на 0,01 EUR."
no_valid_result = "Распознавание не дало корректного результата за отведенные попытки."
file_too_large = "Файл больше 20 МБ после getFile; копия не приложена."
file_unavailable = "Файл не скачивается из Telegram после всех попыток; копия не приложена."
internal_error = "Внутренняя ошибка при обработке чека, подробности в журнале; копия не приложена."

[alerts]
postgres_unreachable = "PostgreSQL недоступен, чеки ждут записи."
gemini_config = "Gemini отклоняет запросы из-за настройки (ключ, квота или модель), чеки ждут."
telegram_unreachable = "Telegram API недоступен."
chain_reference = "Справочник сетей не согласован с плагинами."
internal = "Внутренняя ошибка при обработке чека."

[recoveries]
postgres_unreachable = "PostgreSQL снова доступен."
gemini_config = "Gemini снова отвечает."
telegram_unreachable = "Telegram API снова доступен."
chain_reference = "Справочник сетей снова согласован с плагинами."
internal = "Внутренняя ошибка устранена."
